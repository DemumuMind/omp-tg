name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cd dist && sha256sum omp-tg > omp-tg.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/omp-tg
            dist/omp-tg.sha256
